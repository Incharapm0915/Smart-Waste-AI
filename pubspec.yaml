name: smart_waste_ai
description: Intelligent Food Management & Waste Reduction System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.5

  # Firebase
  firebase_core: ^2.31.1
  firebase_auth: ^4.19.5
  cloud_firestore: ^4.17.3
  firebase_messaging: ^14.9.3
  google_sign_in: ^6.2.1

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.1.2

  # HTTP
  dio: ^5.4.3+1
  http: ^1.2.1

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  glassmorphism: ^3.0.0
  animated_bottom_navigation_bar: ^1.3.3

  # Charts
  fl_chart: ^0.67.0

  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  share_plus: ^9.0.0

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Icons
  cupertino_icons: ^1.0.6
  iconsax: ^0.0.8

  # Date/Time
  table_calendar: ^3.1.2

  # Loading indicators
  loading_animation_widget: ^1.2.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

